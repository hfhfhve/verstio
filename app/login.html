<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232783de'/%3E%3Cpath d='M9 21V11l7 6 7-6v10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=51">
<script>
  try {
    var t = localStorage.getItem('seo_theme');
    if (t !== 'light' && t !== 'dark') t = 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lg { width:100%; max-width:340px; }
  .lg-mark { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; margin:0 auto 18px; }
  .lg-card { border:1px solid var(--line); border-radius:16px; padding:22px 20px;
    background:var(--surface, transparent); }
  .lg-card h1 { font-size:17px; text-align:center; margin-bottom:16px; letter-spacing:-.01em; }
  .lg-row { display:flex; flex-direction:column; gap:8px; }
  .lg-row .input { width:100%; }
  .lg-btn { width:100%; margin-top:12px; }
  .lg-msg { margin-top:12px; font-size:12.5px; line-height:1.5; text-align:center; min-height:16px; color:var(--text-2); }
  .lg-msg.err { color:#d9634f; }
  .lg-eye { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent;
    color:var(--text-2); cursor:pointer; padding:4px; line-height:0; }
  .lg-field { position:relative; }
  .lg-field .input { padding-right:36px; }
</style>
</head>
<body>

<div class="lg">
  <div class="lg-mark">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18V6l7 6 7-6v12"/></svg>
  </div>

  <form class="lg-card" id="lgForm" autocomplete="off">
    <h1>Введите пароль</h1>
    <div class="lg-row">
      <div class="lg-field">
        <input class="input" id="lgPass" type="password" placeholder="Пароль" autocomplete="current-password" required>
        <button class="lg-eye" id="lgEye" type="button" title="Показать">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="btn btn-primary lg-btn" id="lgBtn" type="submit">Войти</button>
    </div>
    <div class="lg-msg" id="lgMsg"></div>
  </form>
</div>

<script src="app.js?v=51"></script>
<script>
/* Вход только по паролю. Логин для API зашит в код и на странице не показывается. */
const LOGIN_EMAIL = 'timurrahimzyanov11@gmail.com';

const TRY_KEY  = 'seo_login_try';
const LOCK_KEY = 'seo_login_lock';
const MAX_TRY  = 5;
const LOCK_MS  = 24 * 60 * 60 * 1000;

const $pass = document.getElementById('lgPass');
const $btn  = document.getElementById('lgBtn');
const $msg  = document.getElementById('lgMsg');
const $form = document.getElementById('lgForm');

function num(k) { const v = parseInt(localStorage.getItem(k) || '0', 10); return isNaN(v) ? 0 : v; }
function lockLeft() { const until = num(LOCK_KEY); return until > Date.now() ? until - Date.now() : 0; }

function human(ms) {
  const h = Math.floor(ms / 3600000);
  const m = Math.ceil((ms % 3600000) / 60000);
  return h > 0 ? h + ' ч ' + m + ' мин' : m + ' мин';
}

function say(text, isErr) {
  $msg.textContent = text || '';
  $msg.classList.toggle('err', !!isErr);
}

function paintLock() {
  const left = lockLeft();
  if (!left) return false;
  $pass.disabled = true;
  $btn.disabled = true;
  say('Вход заблокирован. Попробуйте через ' + human(left) + '.', true);
  return true;
}

function fail(serverText) {
  const used = num(TRY_KEY) + 1;
  localStorage.setItem(TRY_KEY, String(used));
  if (used >= MAX_TRY) {
    localStorage.setItem(LOCK_KEY, String(Date.now() + LOCK_MS));
    localStorage.setItem(TRY_KEY, '0');
    paintLock();
    return;
  }
  const left = MAX_TRY - used;
  say((serverText || 'Неверный пароль') + '. Осталось попыток: ' + left + '.', true);
}

$form.addEventListener('submit', async ev => {
  ev.preventDefault();
  if (paintLock()) return;

  const pass = $pass.value;
  if (!pass) { say('Введите пароль', true); return; }

  $btn.disabled = true;
  say('Проверяем…');

  try {
    await auth.login(LOGIN_EMAIL, pass, true);
    localStorage.removeItem(TRY_KEY);
    localStorage.removeItem(LOCK_KEY);
    const next = new URLSearchParams(location.search).get('next');
    location.replace(next && /^[\w./?=&%-]+$/.test(next) ? next : 'index.html');
  } catch (e) {
    $btn.disabled = false;
    $pass.select();
    const status = e && e.status;
    if (status === 401 || status === 403 || status === 400) fail('Неверный пароль');
    else say('Не удалось проверить пароль. Попробуйте ещё раз.', true);
  }
});

document.getElementById('lgEye').addEventListener('click', () => {
  $pass.type = $pass.type === 'password' ? 'text' : 'password';
  $pass.focus();
});

if (!paintLock()) {
  const used = num(TRY_KEY);
  if (used > 0) say('Осталось попыток: ' + (MAX_TRY - used) + '.', true);
  $pass.focus();
}
setInterval(() => { if (lockLeft()) paintLock(); }, 60000);
</script>
</body>
</html>
