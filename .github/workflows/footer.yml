# Пересборка подвала.
#
# Запускает build.py и коммитит изменённые HTML обратно в ветку.
# Настройки Pages трогать не надо: публикация остаётся прежней,
# из ветки main.
#
# Зацикливания не будет: пуш, сделанный через GITHUB_TOKEN,
# новые запуски workflow не порождает.
#
# ВАЖНО: в сообщении коммита не должно быть [skip ci]. Эта метка
# отменяет все запуски на коммите, включая встроенный
# pages-build-deployment, и сайт перестаёт обновляться.

name: Пересобрать подвал

on:
  push:
    branches: [main]
    paths:
      - 'partials/**'
      - 'build.py'
      - '*.html'
      - '.github/workflows/footer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: footer-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать подвал
        run: python3 build.py

      - name: Закоммитить изменения
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- '*.html'; then
            echo "Подвал уже актуален, коммитить нечего."
            exit 0
          fi

          git add -- '*.html'
          git commit -m "chore: пересобран подвал"

          # В main параллельно пушит воркфлоу Build BUNDLE.txt.
          # Если он успел первым, наш пуш отлетает с remote rejected.
          # Поэтому подтягиваем и отправляем в цикле, а не один раз.
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }

            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Готово с попытки $i."
              exit 0
            fi

            echo "Попытка $i не прошла: ветка уехала. Пробуем ещё раз."
            sleep $((i * 5))
          done

          echo "Не удалось отправить изменения за 5 попыток."
          exit 1
