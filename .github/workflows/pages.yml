# Сборка и публикация verstio.ru на GitHub Pages.
#
# Что делает:
#   1. запускает build.py — подставляет partials/footer.html во все страницы;
#   2. складывает готовый сайт в _site, выкидывая служебные файлы;
#   3. публикует _site на Pages.
#
# Важно: в настройках репозитория Settings → Pages → Source
# нужно выбрать "GitHub Actions" вместо "Deploy from a branch".
# Свой домен из настроек Pages при этом сохраняется.

name: Build & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать подвал на всех страницах
        run: python3 build.py

      - name: Подготовить _site
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '_site' \
            --exclude 'partials' \
            --exclude 'build.py' \
            --exclude 'README.md'
          # Pages не должен пытаться собирать это Jekyll-ом
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
